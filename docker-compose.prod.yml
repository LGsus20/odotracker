services:
  web:
    build: .
    expose:
      - "8000"
    env_file:
      - ./.env.prod
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - db_data:/app/db_data
    networks:
      - proxy-net
    restart: unless-stopped

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    env_file:
      - ./.env.caddy
    depends_on:
      - web
    networks:
      - proxy-net
    restart: unless-stopped

networks:
  proxy-net:

volumes:
  db_data:
  caddy_data:
  caddy_config:
